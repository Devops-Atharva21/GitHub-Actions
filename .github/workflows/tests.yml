name: Secerts scan

on:
    workflow_call:

jobs:
    secrets-scan:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run Gitleaks Scanner
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: $ {{ secerts.GITHUB_TOKEN }}
                GITLEAK_LICENSE: $ {{ secerts.GITLEAK_LICENSE }}